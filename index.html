<!doctype html>
<html lang="he">
  <head>
    <!-- Cookie consent, before anything from Google loads. Until the visitor
         accepts in the banner (src/components/CookieBanner.tsx), GA4 and every
         tag in the GTM container run in Google's consent mode without cookies;
         advertising storage is refused outright, since the shop runs no ads.
         The stored answer is read here so a returning visitor who said yes is
         measured from the first hit. See src/consent.ts. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      (function () {
        var consent = null;
        try { consent = localStorage.getItem('hightide_consent'); } catch (e) {}
        gtag('consent', 'default', {
          analytics_storage: consent === 'granted' ? 'granted' : 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
        });
      })();
    </script>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PTMZNN4M');</script>
    <!-- End Google Tag Manager -->
    <!-- Google tag (gtag.js) - GA4 direct -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-47P3TFMV9S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      // Measurement, and only measurement.
      //
      // Left to itself GA4 also calls Google's advertising side on every visit
      // — stats.g.doubleclick.net, a ga-audiences pixel on google.co.il, a
      // second copy of the pageview to google.com — which builds a remarketing
      // audience out of the shop's visitors. This shop runs no ads and the
      // privacy policy says so in as many words ("לא לפרסום ולא להתאמת
      // מודעות"), so the calls were a promise the site was quietly breaking.
      // Switched off here, the pageviews and events still reach GA4 exactly as
      // before; what stops is the audience building and the Demographics
      // report that depends on it.
      gtag('config', 'G-47P3TFMV9S', {
        allow_google_signals: false,
        allow_ad_personalization_signals: false,
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The loading screen, in plain HTML so it is on screen in the first frame.
         The bundle is ~750KB; until it arrives React has not run, and without
         this the browser shows the crawler fallback text at the bottom of this
         file as unstyled black on white. This marks the document instead, so the
         splash only exists where there is JavaScript to replace it — with
         scripting off the fallback text is the right thing to show. -->
    <script>
      document.documentElement.className = 'js splash-open';
    </script>
    <link rel="preload" as="image" href="/logo-loader.webp" />
    <!-- The shop's typeface, asked for while the page is still parsing. One
         variable font covers every weight from 200 to 800. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&display=swap" />
    <style>
      /* Deliberately mirrors LiquidVeil's column — same square, same 24px gaps,
         same 2px rule, same 28px reserved for the caption — so the logo does not
         jump when the animated version takes over. */
      /* Held from the first frame until the splash is gone. React renders the
         whole shop behind the splash, and the scrollbar that appears when it
         does would otherwise narrow the viewport and shift the logo sideways by
         half a scrollbar — a visible twitch on the handover. */
      .splash-open,
      .splash-open body { overflow: hidden; }
      #splash { display: none; }
      .js #splash {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 10000;
        align-items: center;
        justify-content: center;
        background: #fff;
        opacity: 1;
        transition: opacity 0.25s linear;
      }
      #splash > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      /* The shader maps this same image across its whole square canvas, so
         matching the box matches the artwork pixel for pixel. */
      #splash img {
        display: block;
        width: min(64vmin, 420px);
        height: min(64vmin, 420px);
      }
      /* justify-content is flex-end because the page is RTL and the veil's bar
         grows from the right. */
      #splash .splash-bar {
        display: flex;
        justify-content: flex-end;
        width: min(64vmin, 420px);
        max-width: 100%;
        height: 2px;
        background: #e7e5e4;
      }
      #splash .splash-bar > div { width: 2%; background: #1c1917; }
      /* Holds the space JUST CHILL will occupy. Left empty on purpose: the brand
         face is in the stylesheet, and drawing the words in a fallback font
         first would only make them jump. */
      #splash .splash-caption { height: 28px; }
    </style>

    <!-- Search results. The title is what Google prints as the blue link and
         the description is the grey line under it; without them Google has to
         invent both from whatever it can scrape. -->
    <title>HIGHTIDE VINTAGE — מכנסי גלישה וחולצות וינטג׳ | בורדשורטס אורגינל</title>
    <meta
      name="description"
      content="חנות וינטג׳ ישראלית למכנסי גלישה, חולצות ואקססוריז מקוריים של תור הזהב — Billabong, Quiksilver, O'Neill, Rip Curl ו-Roxy. דרופ חדש כל שבוע, כל פריט יחיד במלאי."
    />
    <link rel="canonical" href="https://hightide-vintage.netlify.app/" />

    <!-- Tab icon. Without these the browser falls back to a generic globe.
         Built from assets/logo.png by scripts/make_favicon.py. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#817fa6" />

    <!-- Link previews in WhatsApp, Instagram and Facebook read these. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HIGHTIDE VINTAGE" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://hightide-vintage.netlify.app/" />
    <meta property="og:title" content="HIGHTIDE VINTAGE — בורדשורטס וחולצות וינטג׳" />
    <meta
      property="og:description"
      content="מכנסי גלישה, חולצות ואקססוריז וינטג׳ מקוריים. דרופ חדש כל שבוע, כל פריט יחיד במלאי."
    />
    <!-- Without a picture the shop unfurls as a bare line of text, which for a
         business whose links travel through Instagram DMs is most of the first
         impression. JPEG on purpose — several unfurlers still do not read WebP,
         and a card with no image is exactly the failure being avoided.
         Built by scripts/make_web_images.py. Product pages replace all of this
         with the garment's own photo — see netlify/functions/product-meta.mjs. -->
    <meta property="og:image" content="https://hightide-vintage.netlify.app/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="מכנסי גלישה וחולצות וינטג׳ מקוריים — HIGHTIDE VINTAGE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://hightide-vintage.netlify.app/og-cover.jpg" />

    <!-- Tells Google this is a shop rather than a personal page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "HIGHTIDE VINTAGE",
        "description": "חנות וינטג׳ למכנסי גלישה, חולצות ואקססוריז מקוריים של תור הזהב.",
        "url": "https://hightide-vintage.netlify.app/",
        "inLanguage": "he",
        "areaServed": "IL",
        "currenciesAccepted": "ILS"
      }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PTMZNN4M"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!-- React replaces this the moment it mounts. It exists so that a crawler
         which does not execute JavaScript still gets a heading and a sentence
         instead of a blank page. -->
    <div id="root">
      <h1>HIGHTIDE VINTAGE — מכנסי גלישה וחולצות וינטג׳</h1>
      <p>
        חנות הוינטג׳ הבלעדית למכנסי גלישה, חולצות, סווטשרטים ואקססוריז של תור הזהב.
        Billabong, Quiksilver, O'Neill, Rip Curl, Roxy. דרופ חדש כל שבוע, וכל פריט קיים
        ביחידה אחת בלבד.
      </p>
    </div>

    <!-- Covers everything above until src/splash.ts is told to let go. -->
    <div id="splash" aria-hidden="true">
      <div>
        <img src="/logo-loader.webp" alt="" width="512" height="512" />
        <div class="splash-bar"><div></div></div>
        <div class="splash-caption"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
