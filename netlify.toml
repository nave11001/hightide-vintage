[build]
  publish = "dist"
  # The inventory is read from Cloudflare D1 at runtime, so the build is just
  # the site. The functions need CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_D1_DATABASE_ID
  # and CLOUDFLARE_API_TOKEN in the Netlify environment variables.
  command = "npm run build:static"

# Everything under /assets/ carries a content hash in its filename — Vite puts
# it there — so a given URL can never point at different bytes. Without this
# Netlify serves them `max-age=0, must-revalidate`, and a returning customer
# asks the server "has this changed?" about fifty-five times before the shop
# draws: the JavaScript, the stylesheet, the font, and every photograph on the
# page. Each answer is 304 Not Modified, so it costs no bandwidth — only a
# round trip each, which on a phone is the part that is actually slow.
#
# A year and immutable means a repeat visit requests none of them. When a
# picture changes its hash changes, so the new URL is fetched and the old one is
# simply never asked for again.
#
# Deliberately not applied to the unhashed files in public/ — logo-loader.webp,
# the icons, og-cover.jpg — which keep fixed URLs across changes and so must go
# on revalidating.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The garment cut-outs, the backdrop behind them and the homepage film keep
# fixed names (scripts/make_cutouts.py rewrites a cut-out in place when a drop
# changes it), so not immutable — but a day without asking, and a week of
# serving the copy on hand while checking in the background, spares a
# returning visitor a round trip per photograph.
[[headers]]
  for = "/cut/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/backdrop.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# What the browser is allowed to do with this site.
#
# Netlify already sends HSTS, so the connection is encrypted and stays that way.
# Everything here is the other half: what may run inside the page once it has
# arrived. None of it is a reaction to a break-in — they are the locks a shop
# site is expected to have on, and an audit reads their absence as a gap.
#
# The list of hosts below is the whole of what this site talks to. It is not a
# guess: Google Tag Manager and GA4 are loaded in index.html, PostHog from
# src/posthog.ts, and the brand faces come from Google Fonts through an @import
# in src/index.css. Add a service to the site and it has to be added here too,
# or the browser will refuse to load it — which is the point of the thing.
#
# 'unsafe-inline' is in script-src because Google's own tag is an inline
# <script> in index.html, and in style-src because React writes style="…" on
# elements. Both are how the site is already built; removing them is a change to
# the site, not to this file.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://us.i.posthog.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://us.i.posthog.com https://us-assets.i.posthog.com; worker-src 'self' blob:; frame-src https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    # Nobody may draw this shop inside a frame of their own — the trick where a
    # copy of a site is wrapped in someone else's page and the taps are
    # harvested. frame-ancestors above says it to current browsers; this says it
    # to the older ones that only know this header.
    X-Frame-Options = "DENY"
    # A file served as a picture is treated as a picture, whatever its contents
    # look like to the browser's guesser.
    X-Content-Type-Options = "nosniff"
    # An outbound link carries the fact that it came from this shop, never which
    # garment the person was reading when they tapped it.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The site asks for none of these, so the browser may refuse all three
    # without ever showing a prompt.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Pages this one opens — WhatsApp, Instagram — are kept in their own browsing
    # context rather than sharing this one. allow-popups, because opening them is
    # exactly what the buy button does.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# The Instagram bot asks these what is in stock — see netlify/functions/bot.mjs
[functions]
  directory = "netlify/functions"

# SPA: every route serves the app. Listed after the functions block so the
# catch-all cannot swallow /.netlify/functions/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
