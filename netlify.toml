[build]
  publish = "dist"
  # The inventory is read from Supabase at runtime, so the build is just the site.
  # Requires VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in the Netlify env vars.
  command = "npm run build:static"

# The Instagram bot asks these what is in stock — see netlify/functions/bot.mjs
[functions]
  directory = "netlify/functions"

# SPA: every route serves the app. Listed after the functions block so the
# catch-all cannot swallow /.netlify/functions/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
