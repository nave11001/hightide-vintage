name: איפוס מלאי אוטומטי

# Runs on the 1st and the 15th of every month at 03:00 UTC (06:00 Israel).
# Every item marked sold in Cloudflare D1 is appended to sold_log.csv, then
# deleted from the catalogue along with its item_photos rows.
#
# The photograph files are listed, not deleted. They live in this repository
# now rather than in a bucket, which makes them the only copies there are, and
# a scheduled job that removes a shop's photographs unattended is one bad query
# away from being unrecoverable. The run prints their paths; removing them is a
# decision for a person.
#
# The shipped fallback catalogue is rebuilt afterwards, so it does not go on
# offering garments the database has just let go of.
on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No pip install. scripts/d1.py talks to D1 over urllib, which is in the
      # standard library — the Supabase client was a package download on every
      # single run, and one more thing that could fail before any work started.

      # No --keep-sale here: everything sold goes, sale or not. The flag exists
      # for the one-off it was built for — a sale across the whole shop, where
      # clearing the sold pieces would have emptied the rails — and that is a
      # judgement call for a person on the day, not a standing rule.
      - name: Reset inventory (log and remove sold items)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/reset_inventory.py

      - name: Rebuild the shipped fallback catalogue from D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/make_catalog_snapshot.py

      - name: Commit the sales log and the rebuilt catalogue
        run: |
          git config user.name "HighTide Inventory Bot"
          git config user.email "galnimrod9@gmail.com"
          git add assets/inventory/excel/sold_log.csv src/catalog-snapshot.json
          if git diff --cached --quiet; then
            echo "Nothing sold since the last reset — no changes."
          else
            git commit -m "chore: איפוס מלאי אוטומטי ($(date +%d/%m/%Y))"
            git push
          fi
