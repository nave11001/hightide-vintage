name: איפוס מלאי אוטומטי

# Runs on the 1st and the 15th of every month at 03:00 UTC (06:00 Israel).
# Every item marked sold in Supabase is appended to sold_log.csv, then deleted
# from the catalogue along with its photos. No site rebuild is needed — the
# shop reads the database live, so the change is visible immediately.
on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet supabase

      - name: Reset inventory (log and remove sold items)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/reset_inventory.py

      - name: Commit the sales log
        run: |
          git config user.name "HighTide Inventory Bot"
          git config user.email "galnimrod9@gmail.com"
          git add assets/inventory/excel/sold_log.csv
          if git diff --cached --quiet; then
            echo "Nothing sold since the last reset — no changes."
          else
            git commit -m "chore: איפוס מלאי אוטומטי ($(date +%d/%m/%Y))"
            git push
          fi
